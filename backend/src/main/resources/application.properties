spring.application.name=fitai-backend
server.port=${PORT:8081}

# Banco de dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Flyway gerencia o schema — ddl-auto=validate apenas confere que o schema bate com as entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Google OAuth2
google.client-id=${GOOGLE_CLIENT_ID}

# CORS — origens permitidas separadas por vírgula
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,https://fit-ai-theta-eight.vercel.app}

# E-mail (SendGrid — API via HTTPS; evita bloqueio de portas SMTP em PaaS como o Railway).
# sendgrid.from precisa ser um remetente verificado via Single Sender Verification.
sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from=${SENDGRID_FROM}
app.frontend-url=${FRONTEND_URL:https://fit-ai-theta-eight.vercel.app}

# Kafka — broker gerenciado (Confluent Cloud / Upstash), publica eventos de auditoria
# (login, treino criado, sessão registrada) num único tópico. Sem consumidor ainda.
# Sem KAFKA_BOOTSTRAP_SERVERS configurado, a publicação falha e é só logada como aviso —
# ver AuditEventPublisher — nenhum fluxo principal depende disso pra funcionar.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
app.kafka.audit-topic=${KAFKA_AUDIT_TOPIC:fitai.audit-events}

# Kafka — geração de treino por IA assíncrona: o backend produz o pedido em
# workout-generation-requested-topic (consumido pelo worker Node.js) e consome
# o resultado em workout-generation-result-topic (produzido pelo worker) via
# WorkoutGenerationResultListener. Chave/valor String pura nos dois lados —
# desserialização manual do JSON no listener, ver WorkoutGenerationResultListener.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.workout-generation-requested-topic=${KAFKA_WORKOUT_GEN_REQUESTED_TOPIC:fitai.workout-generation-requested}
app.kafka.workout-generation-result-topic=${KAFKA_WORKOUT_GEN_RESULT_TOPIC:fitai.workout-generation-result}
app.kafka.workout-generation-consumer-group=${KAFKA_WORKOUT_GEN_CONSUMER_GROUP:fitai-backend-workout-results}
