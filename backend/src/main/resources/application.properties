spring.application.name=fitai-backend
server.port=${PORT:8081}

# Banco de dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Flyway gerencia o schema — ddl-auto=validate apenas confere que o schema bate com as entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Google OAuth2
google.client-id=${GOOGLE_CLIENT_ID}

# CORS — origens permitidas separadas por vírgula
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,https://fit-ai-theta-eight.vercel.app}

# E-mail (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:${MAIL_USERNAME}}
app.frontend-url=${FRONTEND_URL:https://fit-ai-theta-eight.vercel.app}
