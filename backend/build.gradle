plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.fitai'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Google OAuth2 - validação de ID token
	implementation 'com.google.api-client:google-api-client:2.2.0'

	// Flyway — migrations de banco de dados versionadas
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Kafka — publica eventos de auditoria (login, treino criado, etc.) e agora também
	// o pedido/resultado de geração de treino por IA. spring-boot-kafka é a autoconfiguração
	// (KafkaTemplate/@KafkaListener) — no Spring Boot 4, cada tecnologia ganhou seu próprio
	// módulo de autoconfiguração em vez de tudo dentro de spring-boot-autoconfigure.
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.springframework.boot:spring-boot-kafka'

	// ObjectMapper Jackson 2 usado manualmente (não injetado — mesmo padrão de
	// SendGridClient) pra (de)serializar os eventos/records de geração de treino;
	// o Boot 4 autoconfigura só um ObjectMapper Jackson 3 (tools.jackson), que não
	// é o tipo com.fasterxml.jackson usado aqui. jackson-datatype-jsr310 dá suporte
	// a java.time.Instant na desserialização manual do evento de resultado do worker.
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}

tasks.named('test') {
	useJUnitPlatform()
}
